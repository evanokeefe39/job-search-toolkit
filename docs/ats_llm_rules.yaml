# EMBEDDING MODEL BENCHMARKS
# (amiradridi/Job-Resume-Matching, precision@15 evaluation)
# ═══════════════════════════════════════════════════════════════

embedding_benchmarks:
  description: "Precision@15 for 6 sentence embedding models on skills matching task."
  evaluated: 2023
  source: "amiradridi/Job-Resume-Matching/services/Models evaluation.ipynb"
  models:
    "bert-base-nli-mean-tokens":
      rank: 1
      note: "Highest precision — chosen for production."
    "all-mpnet-base-v2":
      rank: 2
      note: "Used in Rules.py production code; second highest precision."
    "all-roberta-large-v1":
      rank: 3
    "all-MiniLM-L12-v1":
      rank: 4
    "paraphrase-MiniLM-L6-v2":
      rank: 5
    "gpt3":
      rank: 6
      note: "Lowest precision; not recommended for semantic matching."
  current_best_practice: "Use all-mpnet-base-v2 or sentence-transformers/all-MiniLM-L6-v2 for production (2026). BERT-based models have been superseded by newer architectures but the relative ranking of embedding quality vs speed holds."

