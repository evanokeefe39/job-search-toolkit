# v2 — 2026-08-09, 54 rules, 3 prompts, 17 sources
# Supersedes v1 (35 rules, 10 sources). Changelog at docs/ats_llm_rules.md §"What Changed".
# ATS Rules for LLM Prompt Injection — Structured YAML Artifact
# Compiled 2026-08-09 from 14+ tools (source-verified).
# Provenance: USER_POLICY (highest authority, standing preference), CODE_VERIFIED (source read), DOCUMENTED (README/paper/wiki),
#   ANECDOTAL (Reddit/forum), DEAD_END (URL blocked/404).
# Weight: 1.0 = mandatory (all tools agree), lower = less consensus.

rules:
  # ═══════════════════════════════════════════════════════════════
  # FORMAT RULES (from ATSFlow formatting.js — all 10 CODE_VERIFIED)
  # ═══════════════════════════════════════════════════════════════

  - id: F1
    category: format
    rule: "NO tables. ATS parsers read left-to-right, top-to-bottom. Tables break this flow. Convert tables to simple text sections with clear hierarchies."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:noTables()", "CV-ATS-Checker/scoring.py:format_warnings()"]
    weight: 1.0
    severity: critical
    score_deduction: 100
    trigger: "table-based layout detected"

  - id: F2
    category: format
    rule: "NO multi-column layouts. ATS reads line-by-line. Multi-column scrambles content order. Use single-column, stack all content vertically."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:noMultiColumn()"]
    weight: 1.0
    severity: critical
    score_deduction: 100
    trigger: "multi-column layout detected"

  - id: F3
    category: format
    rule: "NO headers or footers with important content. Many ATS systems skip header/footer regions entirely. Move name and contact into the main body."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:noHeadersFooters()"]
    weight: 0.9
    severity: high
    score_deduction: 70
    trigger: "content in header or footer regions"

  - id: F4
    category: format
    rule: "NO images, photos, charts, icons, logos, or infographics. ATS cannot extract text from images. Use text only."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:noImages()", "ats_resume_knowledge_2026.md:§1"]
    weight: 1.0
    severity: medium
    score_deduction: 50
    trigger: "images, photos, charts, icons, logos, or infographics detected"

  - id: F5
    category: format
    rule: "NO text boxes or floating elements. They break the document flow ATS parsers expect. Use standard paragraphs and bullet points."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:noTextBoxes()"]
    weight: 0.9
    severity: high
    score_deduction: 80
    trigger: "text boxes or positioned/floating elements detected"

  - id: F6
    category: format
    rule: "Web-safe fonts only: Arial, Times New Roman, Calibri, Helvetica, Georgia, Verdana. Non-standard fonts may not render correctly in ATS."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:webSafeFonts() — -20 per unsafe font"]
    weight: 0.9
    severity: low
    score_deduction: 20
    trigger: "non-standard font detected"

  - id: F7
    category: format
    rule: "NO unicode/special bullets. Use only: •, -, *, ◦. Special bullets may display as garbage characters in ATS."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:noUnicodeBullets() — -5 per unicode bullet"]
    weight: 0.8
    severity: low
    score_deduction: 5
    trigger: "unicode or special bullet characters detected"

  - id: F8
    category: format
    rule: "Consistent date formats throughout. Inconsistency may confuse ATS date parsing. Standardize to one format (MM/YYYY or Month YYYY)."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:consistentDates() — -10 per inconsistent format"]
    weight: 0.8
    severity: low
    score_deduction: 10
    trigger: "inconsistent date formats detected"

  - id: F9
    category: format
    rule: "PDF format (preferred) or DOCX. PDF preserves formatting while remaining ATS-parseable. DOCX acceptable (90% score). Never image-based PDF."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:supportedFileFormat() — PDF=100, DOCX=90, other=50"]
    weight: 0.9
    severity: medium
    score_deduction: 10
    trigger: "unsupported file format"

  - id: F10
    category: format
    rule: "NO background colors or shading. May reduce text readability in ATS. Use white/transparent backgrounds. Add emphasis with bold or headings."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/formatting.js:noBackgroundColors()"]
    weight: 0.7
    severity: low
    score_deduction: 30
    trigger: "background colors or shading detected"

  # ═══════════════════════════════════════════════════════════════
  # STRUCTURE RULES (from ATSFlow structure.js — all 10 CODE_VERIFIED)
  # ═══════════════════════════════════════════════════════════════

  - id: S1
    category: structure
    rule: "Standard section headers only. 16 recognized headers: contact, summary, objective, experience, work experience, professional experience, employment, education, skills, technical skills, core competencies, certifications, licenses, projects, awards, volunteer, references. Non-standard header: -15 score each."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:standardSectionHeaders() — 16 recognized headers, -15 per non-standard"]
    weight: 1.0
    severity: medium
    score_deduction: 15
    trigger: "non-standard section header"

  - id: S2
    category: structure
    rule: "Parseable contact info: name (2+ chars), valid email, valid phone. All three REQUIRED. Missing any: CRITICAL severity."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:parseableContactInfo()"]
    weight: 1.0
    severity: critical
    score_deduction: 33
    trigger: "missing or invalid name, email, or phone"

  - id: S3
    category: structure
    rule: "Reverse chronological order (most recent → oldest) for all experience entries. Forward-chronological: -20 per issue."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:chronologicalOrder() — -20 per ordering issue"]
    weight: 1.0
    severity: medium
    score_deduction: 20
    trigger: "experience entries not in reverse chronological order"

  - id: S4
    category: structure
    rule: "Spell out all acronyms on first use. Example: 'Application Programming Interface (API)'. Unspelled-out acronym: -10 each."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:acronymsSpelledOut() — -10 per unspelled acronym"]
    weight: 0.7
    severity: low
    score_deduction: 10
    trigger: "unspelled acronym detected"

  - id: S5
    category: structure
    rule: "Clear, standard job titles. Avoid internal jargon. BAD: 'Code Ninja', 'Growth Hacker', 'Rockstar Developer'. GOOD: 'Software Engineer', 'Senior Product Manager', 'Data Analyst'."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:clearJobTitles() — penalty proportional to unclear fraction"]
    weight: 0.8
    severity: medium
    score_deduction: 50
    trigger: "non-standard or jargon job titles"

  - id: S6
    category: structure
    rule: "Proper section ordering: Contact → Summary → Experience → Education → Skills → Certifications → Projects → Awards → Volunteer → References. Score based on similarity to ideal order."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:properSectionOrdering() — <80% match = fail"]
    weight: 0.7
    severity: low
    score_deduction: 20
    trigger: "sections out of logical order"

  - id: S7
    category: structure
    rule: "NO orphaned/empty sections or items. Empty sections or items with no text: -15 per occurrence."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:noOrphanedContent() — -15 per orphaned section"]
    weight: 0.8
    severity: low
    score_deduction: 15
    trigger: "empty sections or content items"

  - id: S8
    category: structure
    rule: "Consistent heading hierarchy. H1 for name, H2 for section titles, H3 for job titles/subsections. Inconsistency: -10 per issue."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:consistentHeadingHierarchy() — -10 per issue"]
    weight: 0.6
    severity: low
    score_deduction: 10
    trigger: "heading hierarchy inconsistency"

  - id: S9
    category: structure
    rule: "Clear section boundaries with adequate spacing. Each section must have a clear title and visual separation from the next."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:clearSectionBoundaries() — -10 per boundary issue"]
    weight: 0.7
    severity: low
    score_deduction: 10
    trigger: "unclear section boundaries"

  - id: S10
    category: structure
    rule: "NO complex tables (merged cells, nested tables). They break ATS parsing logic. Use simple lists."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/structure.js:noComplexTables() — -30 per complex table"]
    weight: 0.9
    severity: high
    score_deduction: 30
    trigger: "complex table structures with merged cells or nesting"

  # ═══════════════════════════════════════════════════════════════
  # CONTENT RULES (from ATSFlow content.js — all 10 CODE_VERIFIED)
  # ═══════════════════════════════════════════════════════════════

  - id: C1
    category: content
    rule: "Keyword density: 2-8% of total words. Below 2% = too thin, add more relevant keywords naturally. Above 8% = keyword stuffing, reduce."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:keywordDensity() — optimal 2-8%"]
    weight: 0.9
    severity: medium
    score_deduction: null
    trigger: "keyword density outside 2-8% range"

  - id: C2
    category: content
    rule: "Dedicated Skills section with 5-15 skills REQUIRED. Fewer than 5 skills = FAIL. More than 15 acceptable but max recommended."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:dedicatedSkillsSection() — ≥5 skills required"]
    weight: 1.0
    severity: high
    score_deduction: 50
    trigger: "no dedicated skills section or <5 skills"

  - id: C3
    category: content
    rule: "Quantified achievements: ≥40% of bullet points MUST contain numbers, percentages, or metrics. Target: 40%+. Examples: 'Increased sales by 25%', 'Managed team of 10', '$2M budget'."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:quantifiedAchievements() — ≥40% threshold", "Resume-Analyzer-MLOps/ats_scorer.py — ≥5 numbers"]
    weight: 1.0
    severity: medium
    score_deduction: 40
    trigger: "<40% of bullets contain numbers/metrics"

  - id: C4
    category: content
    rule: "ZERO personal pronouns (I, me, my, mine, myself, we, us, our, ours). -10 score per pronoun found. Write in third-person implied. BAD: 'I managed a team'. GOOD: 'Managed team of 10 engineers'."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:noPersonalPronouns() — -10 per pronoun"]
    weight: 1.0
    severity: medium
    score_deduction: 10
    trigger: "personal pronouns detected"

  - id: C5
    category: content
    rule: "Action verb bullets: ≥80% of bullets must start with a strong action verb. 22 recognized verbs: achieved, implemented, developed, managed, led, created, designed, built, launched, optimized, increased, decreased, improved, reduced, streamlined, automated, coordinated, established, executed, generated, spearheaded, delivered."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:actionVerbBullets() — ≥80% threshold, 22 recognized verbs"]
    weight: 0.9
    severity: medium
    score_deduction: 20
    trigger: "<80% of bullets start with action verb"

  - id: C6
    category: content
    rule: "Appropriate length: 400-1400 words (roughly 1-2 pages at 600 words/page). <400 = too short. >1400 = too long. SUPERSEDED by UP1 — target rich 1 page, 2 pages absolute max."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:appropriateLength()", "SUPERSEDED by UP1"]
    weight: 0.4
    severity: low
    score_deduction: 25
    trigger: "word count outside 400-1400 range"

  - id: C7
    category: content
    rule: "NO typos or grammar errors. Common typos checked: teh, recieve, occured, seperate, acheive, managment, experiance, responsable. -10 per issue."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:noTyposOrGrammar() — -10 per issue, 8 common typos"]
    weight: 0.8
    severity: high
    score_deduction: 10
    trigger: "typo or grammar error detected"

  - id: C8
    category: content
    rule: "Industry-specific keywords: ≥40% match rate against detected industry keyword list. Below 40% = add more industry-specific terms."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:industryKeywords() — ≥40% match threshold"]
    weight: 0.7
    severity: medium
    score_deduction: 60
    trigger: "<40% of industry keywords present"

  - id: C9
    category: content
    rule: "Proper noun capitalization: company names, product names, certifications must be correctly capitalized."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:properNounCapitalization()"]
    weight: 0.8
    severity: low
    score_deduction: 20
    trigger: "improper capitalization of known proper nouns"

  - id: C10
    category: content
    rule: "NO excessive jargon or internal-only acronyms. Penalty if >5 unrecognized abbreviations or internal terms detected."
    provenance: CODE_VERIFIED
    sources: ["ATSFlow/checks/content.js:noExcessiveJargon()"]
    weight: 0.7
    severity: low
    score_deduction: 10
    trigger: ">5 unrecognized abbreviations or internal terms"

  # ═══════════════════════════════════════════════════════════════
  # USER POLICY RULES (standing preferences, highest authority)
  # ═══════════════════════════════════════════════════════════════

  - id: UP1
    category: user_policy
    rule: "TARGET 1 PAGE, 2 PAGES ABSOLUTE MAXIMUM. Resume must be rich and tightly tuned to the JD. Every bullet earns its space — no filler. This overrides C6 (400-1400 words) and Q1 (200-1000). Target ~400-700 words for a dense, impactful 1-pager. Senior/10yr+ candidates may need 2 pages but must prune aggressively."
    provenance: USER_POLICY
    sources: ["User standing preference — 2026-08-09"]
    weight: 1.0
    severity: critical
    trigger: null

  - id: UP2
    category: user_policy
    rule: "SABBATICAL: do NOT list as top experience or even in the experience section. For now, mention it only in the Summary section if relevant. Several in-flight sabbatical projects (not yet finished) may warrant experience-section placement later but are not ready. This is TEMPORARY — re-evaluate when projects land."
    provenance: USER_POLICY
    sources: ["User standing preference — 2026-08-09"]
    weight: 1.0
    severity: critical
    trigger: "sabbatical placed in experience section"
  # ═══════════════════════════════════════════════════════════════
  # ONTOLOGY-BASED MATCHING RULES
  # (amiradridi/Job-Resume-Matching 134★, Rules.py CODE_VERIFIED)
  # ═══════════════════════════════════════════════════════════════

  - id: O1
    category: ontology
    rule: "Degree-level matching: compare candidate's highest degree against job's minimum degree level using an ontology (0=no degree, 1=high school, 2=associate, 3=bachelor, 4=master, 5=PhD). If candidate ≥2 levels above minimum: score 0.5. If candidate 0-1 levels above: score 1.0."
    provenance: CODE_VERIFIED
    sources: ["amiradridi/Job-Resume-Matching/services/Rules.py:degree_matching()"]
    weight: 0.9
    severity: null
    score_deduction: null
    trigger: null

  - id: O2
    category: ontology
    rule: "Major matching: candidate's major matches job's acceptable major exactly → score 1.0. Same category but not exact → score 0.5. Different category → score 0. Uses a pre-defined major-category ontology mapping."
    provenance: CODE_VERIFIED
    sources: ["amiradridi/Job-Resume-Matching/services/Rules.py:major_matching()"]
    weight: 0.9
    severity: null
    score_deduction: null
    trigger: null

  - id: O3
    category: ontology
    rule: "Skills semantic matching: use SentenceTransformer('all-mpnet-base-v2') embeddings. For each JD skill: exact match in resume = +1.0. Semantic match via cosine similarity ≥0.4 = +similarity_score. Final = sum / len(JD skills)."
    provenance: CODE_VERIFIED
    sources: ["amiradridi/Job-Resume-Matching/services/Rules.py:semantic_similarity() — threshold 0.4, model all-mpnet-base-v2"]
    weight: 0.9
    severity: null
    score_deduction: null
    trigger: null

  - id: O4
    category: ontology
    rule: "Final matching score: mean of (skills_semantic_score + degree_match_score + major_match_score) / 3. Equal weighting across all three dimensions."
    provenance: CODE_VERIFIED
    sources: ["amiradridi/Job-Resume-Matching/services/Rules.py:matching_score()"]
    weight: 0.8
    severity: null
    score_deduction: null
    trigger: null

  - id: O5
    category: ontology
    rule: "Embedding model benchmark (6 models evaluated, precision@15): bert-base-nli-mean-tokens = highest precision (chosen). Also tested: all-mpnet-base-v2, paraphrase-MiniLM-L6-v2, gpt3, all-MiniLM-L12-v1, all-roberta-large-v1. Use Sentence Transformers for production semantic matching."
    provenance: CODE_VERIFIED
    sources: ["amiradridi/Job-Resume-Matching/services/Models evaluation.ipynb"]
    weight: 0.6
    severity: null
    score_deduction: null
    trigger: null

  # ═══════════════════════════════════════════════════════════════
  # ANTI-FABRICATION RULES (non-negotiable, all CODE_VERIFIED)
  # ═══════════════════════════════════════════════════════════════

  - id: A1
    category: anti_fabrication
    rule: "NEVER fabricate facts, numbers, metrics, percentages, or dollar amounts not in the master resume."
    provenance: CODE_VERIFIED
    sources: ["Resume-Tailor-AI/prompts.ts:Rule 4", "Waaangjl/resume-tailor/prompts.py", "Razzy005/resume-tailor/ai.js", "career-tailor", "ResuMeshAI"]
    weight: 1.0
    trigger: "any added metric, stat, or dollar figure not in original"

  - id: A2
    category: anti_fabrication
    rule: "NEVER add technologies, tools, platforms, or skills not evidenced in the master resume."
    provenance: CODE_VERIFIED
    sources: ["Resume-Tailor-AI", "Waaangjl/resume-tailor", "Razzy005/resume-tailor", "career-tailor", "ResuMeshAI"]
    weight: 1.0
    trigger: "any added tech/skill/stack item not in original"

  - id: A3
    category: anti_fabrication
    rule: "NEVER change job titles, company names, employment dates, or education credentials."
    provenance: CODE_VERIFIED
    sources: ["Resume-Tailor-AI", "Waaangjl/resume-tailor", "Razzy005/resume-tailor", "career-tailor", "cv4offer"]
    weight: 1.0
    trigger: "any changed title, date, employer name, degree"

  - id: A4
    category: anti_fabrication
    rule: "NEVER add target company as past employer (ZERO PHANTOM EXPERIENCE)."
    provenance: CODE_VERIFIED
    sources: ["ResuMeshAI", "career-tailor", "Waaangjl/resume-tailor"]
    weight: 1.0
    trigger: "target company name appears as employer"

  - id: A5
    category: anti_fabrication
    rule: "Same number of bullets per role as original. Do not merge, split, or drop silently."
    provenance: CODE_VERIFIED
    sources: ["Resume-Tailor-AI/prompts.ts:Rule 6", "cv4offer", "career-tailor"]
    weight: 0.9
    trigger: "bullet count mismatch per role"

  - id: A6
    category: anti_fabrication
    rule: "If a bullet needs no keyword change, return it EXACTLY unchanged (character-level identity)."
    provenance: CODE_VERIFIED
    sources: ["Resume-Tailor-AI/prompts.ts:Rule 1", "Waaangjl/resume-tailor"]
    weight: 0.9
    trigger: null

  - id: A7
    category: anti_fabrication
    rule: "When inserting a JD keyword, use minimal edit: replace only the variant word, not the whole sentence."
    provenance: CODE_VERIFIED
    sources: ["Resume-Tailor-AI/prompts.ts:Rule 2-3"]
    weight: 0.8
    trigger: null

  - id: A8
    category: anti_fabrication
    rule: "No self-assessment clauses ('demonstrating…', 'showcasing…', 'proving…')."
    provenance: CODE_VERIFIED
    sources: ["Razzy005/resume-tailor/ai.js", "Waaangjl/resume-tailor"]
    weight: 0.8
    trigger: null

  - id: A9
    category: anti_fabrication
    rule: "Frozen sections: education credentials, certifications, and references are NEVER modified."
    provenance: CODE_VERIFIED
    sources: ["cv4offer", "career-tailor", "Waaangjl/resume-tailor"]
    weight: 0.9
    trigger: null

