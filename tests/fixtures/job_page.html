<!doctype html><html><head><script type="application/ld+json">{"@context": "http://schema.org", "@type": "JobPosting", "datePosted": "2026-07-15T09:20:36.000Z", "description": "&lt;p&gt;Nous recherchons &lt;strong&gt;un(e) Analytics Engineer &lt;/strong&gt;expérimenté(e), maîtrisant &lt;strong&gt;Microsoft Fabric&lt;/strong&gt;, pour accompagner les équipes métier dans l'exploitation et la valorisation des données. Vous interviendrez sur l'ensemble de la chaîne, de la préparation des données jusqu'à la restitution via des tableaux de bord, en tirant parti de l'écosystème unifié de &lt;strong&gt;Microsoft Fabric&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Vos missions&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Analyse de données et reporting&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Concevoir et développer des rapports et tableaux de bord Power BI répondant aux besoins métier&lt;/li&gt;&lt;li&gt;Construire des modèles sémantiques et des mesures DAX performantes&lt;/li&gt;&lt;li&gt;Analyser les données pour identifier tendances, anomalies et opportunités&lt;/li&gt;&lt;li&gt;Restituer les résultats d'analyse de façon claire aux parties prenantes non techniques&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Microsoft Fabric et ingénierie des données&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Construire et administrer des Lakehouses et Data Warehouses dans Microsoft Fabric (OneLake)&lt;/li&gt;&lt;li&gt;Développer des pipelines de données avec Data Factory (Fabric)&lt;/li&gt;&lt;li&gt;Utiliser des notebooks (PySpark/Spark SQL) pour la préparation et la transformation des données&lt;/li&gt;&lt;li&gt;Exploiter le mode Direct Lake pour optimiser les performances des rapports&lt;/li&gt;&lt;li&gt;Contribuer à la mise en place de solutions de Real-Time Analytics et de Data Activator si besoin&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Qualité et gouvernance des données&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Mettre en place des contrôles de qualité et de cohérence des données&lt;/li&gt;&lt;li&gt;Documenter les modèles de données, les flux et les indicateurs&lt;/li&gt;&lt;li&gt;Veiller au respect des règles de gouvernance, de sécurité et de confidentialité des données&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Collaboration et accompagnement&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Travailler en étroite collaboration avec les équipes métier pour cadrer les besoins analytiques&lt;/li&gt;&lt;li&gt;Accompagner et former les utilisateurs sur les outils Power BI et Microsoft Fabric&lt;/li&gt;&lt;li&gt;Participer aux choix d'architecture data en lien avec les équipes IT et Data Engineering&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Profil recherché&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Expérience confirmée (3-5 ans minimum)&lt;/li&gt;&lt;li&gt;Maîtrise de Microsoft Fabric (Lakehouse, Data Warehouse, Data Factory, notebooks, OneLake)&lt;/li&gt;&lt;li&gt;Excellente maîtrise de Power BI et du langage DAX&lt;/li&gt;&lt;li&gt;Bonne maîtrise de SQL, connaissance de Python appréciée&lt;/li&gt;&lt;li&gt;Esprit d'analyse, de synthèse et sens du détail&lt;/li&gt;&lt;li&gt;Bon relationnel et capacité à vulgariser des sujets techniques auprès d'interlocuteurs métier&lt;/li&gt;&lt;li&gt;Autonomie, rigueur et curiosité pour les nouvelles technologies data&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Pourquoi nous rejoind&lt;/strong&gt;re &lt;strong&gt;?&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Vous travaillerez au sein d'une équipe experte, collaborative et bienveillante, pour un projet Data stratégique, et avec des technologies modernes.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;Notre Entreprise &lt;strong&gt;Logical Conseils&lt;/strong&gt; est une entreprise des services du numérique spécialisée en Data, basée à Croix, dans le Nord. Notre rôle est de conseiller et accompagner nos clients dans chaque étape de leur transformation IT. Afin de garantir des solutions adaptées à chaque défi, Logical Conseils s’appuie sur&lt;strong&gt; plusieurs pôles&lt;/strong&gt; &lt;strong&gt;clés&lt;/strong&gt;, assurant ainsi un suivi sur mesure et stratégique :&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Pôle Data Pl&lt;/strong&gt;a&lt;strong&gt;tform&lt;/strong&gt; : verticale dédiée aux plateformes de données cloud : &lt;strong&gt;GCP/Azure/AWS/Snowflake&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Pôle Data Analytics &amp;amp; IA&lt;/strong&gt; : Expertise en Data intelligence, IA , et Data Science&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Pôle D'experts Fonctionnels &lt;/strong&gt;: Expertise Fonctionnelle Data dans différents secteurs&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;Entreprise à taille humaine, &lt;strong&gt;Logical Conseils&lt;/strong&gt; accompagne les grands comptes de la région. Notre agilité nous permet d'intervenir sur des secteurs variés tels que le Retail, la banque-assurance, l'industrie, les transports ou encore la grande distribution.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Nos valeurs&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Au-delà de l’innovation technique et technologique, la véritable innovation à mener dans les entreprises est humaine. Parce-que l’humain est au cœur de toute ambition de performance, nous renversons la pyramide du management pour placer nos employés en tête des priorités de l’entreprise. Nous sommes convaincus que leur épanouissement est la clé de la réussite collective. Cela se traduit par un accompagnement de proximité, une communication transparente, des échanges réguliers avec les managers référents, ainsi qu’un suivi structuré de l’évolution professionnelle. Nous construisons ensemble votre parcours, rythmé par des formations, des certifications et des missions alignées avec vos objectifs, afin d’assurer une progression solide et en phase avec les technologies innovantes du marché.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Avantages salariés complémentaires :&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Tickets restaurants : 13€ par ticket&lt;/li&gt;&lt;li&gt;Remboursement à 100 % des abonnements de transports en commun&lt;/li&gt;&lt;li&gt;Mutuelle santé avec de hautes garanties&lt;/li&gt;&lt;li&gt;Prise en charge à 100% de l’assurance Prévoyance&lt;/li&gt;&lt;li&gt;Comité d'entreprise : Billetterie, cartes cadeaux, loisirs, culture, etc...&lt;/li&gt;&lt;li&gt;Des évènements réguliers : afterwork, soirée d’agence, activités sportives et associatives, etc...&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Prêt(e) à rejoindre une entreprise qui t'accompagnera à bâtir une solide carrière ? Postule dès aujourd'hui !&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;", "employmentType": "FULL_TIME", "hiringOrganization": {"@type": "Organization", "name": "Logical Conseils", "sameAs": "https://fr.linkedin.com/company/logical-conseils", "logo": "https://media.licdn.com/dms/image/v2/D4E0BAQFSSWnczgQtig/company-logo_200_200/B4EZp3AGRtKgAI-/0/1762933106274/logical_conseils_logo?e=2147483647&amp;v=beta&amp;t=LwrPOTGrdcvBzoDiZT977UEg5uPyZIfybZEfu3hVlnY"}, "identifier": {"@type": "PropertyValue", "name": "Logical Conseils"}, "image": "https://media.licdn.com/dms/image/v2/D4E0BAQFSSWnczgQtig/company-logo_100_100/B4EZp3AGRtKgAQ-/0/1762933106274/logical_conseils_logo?e=2147483647&amp;v=beta&amp;t=NLSR0ZNcTbizA2dQ8lDox7ZTZOO7sJFdav3tlQ_fm70", "industry": "Technologies et services de l’information", "jobLocation": {"@type": "Place", "address": {"@type": "PostalAddress", "addressCountry": "FR", "addressLocality": "Lille et périphérie", "addressRegion": null, "streetAddress": null}, "latitude": 50.618595, "longitude": 3.069455}, "skills": "", "title": "Analytics Engineer - Microsoft Fabric - CDI - LILLE", "validThrough": "2026-09-01T15:16:05.000Z", "educationRequirements": {"@type": "EducationalOccupationalCreden
