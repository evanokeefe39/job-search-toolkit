[project]
name = "job-search-toolkit"
version = "0.1.0"
description = "Job discovery, enrichment, and application automation: scrapers, a Dagster ETL, resume tailoring, and agent skills."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "selectolax>=0.4.11",
    "python-dotenv>=1.2.0",
    "typer>=0.27.1",
    "yfinance>=0.2.66",
    "dagster>=1.13.16",
    "instructor>=1.15.4",
    "crawlee>=1.9.0",
    "playwright>=1.62.0",
    "curl-cffi>=0.16.0",
    "rendercv[full]>=2.8",
    "jinja2>=3.1.6",
    "pydantic-ai>=2.27.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
job-search-toolkit = "job_search_toolkit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_search_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
skills = "job_search_toolkit/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
